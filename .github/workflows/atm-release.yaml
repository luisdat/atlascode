name: ATM Internal Release

# Builds and publishes an internal-only .vsix as a GitHub Release on this fork
# every time a commit lands on main. This does NOT touch the VS Code
# Marketplace or OpenVSX (package.json's "publisher" is still "atlassian",
# and we have no credentials for - nor any business publishing to - that
# listing). Versions look like "<upstream-base-version>+atmp<N>". The base
# version is taken automatically from the newest stable atlassian/atlascode
# tag (vX.Y.Z) contained in the commit being built, and N auto-increments per
# base version, restarting at 1 whenever a newer upstream release is merged.
# The upstream release.yaml/release-nightly.yaml workflows are disabled on
# this fork for the same reason - they exist for Atlassian's own Marketplace
# publishing.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'luisdat/atlascode'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          git fetch --tags --force

          # The base version always comes from the official upstream repo: the
          # newest stable upstream tag (plain vX.Y.Z, no -nightly etc.) whose
          # commit is already merged into this build. Upstream tags are fetched
          # into a private ref namespace so they never mix with our atmp tags.
          git fetch --no-tags --force https://github.com/atlassian/atlascode.git \
            '+refs/tags/v*:refs/upstream-tags/v*'

          BASE_VERSION=""
          for t in $(git for-each-ref --format='%(refname:strip=2)' refs/upstream-tags/ \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV); do
            if git merge-base --is-ancestor "refs/upstream-tags/$t" HEAD; then
              BASE_VERSION="${t#v}"
              break
            fi
          done

          if [ -z "$BASE_VERSION" ]; then
            echo "No stable upstream vX.Y.Z tag is an ancestor of HEAD." >&2
            exit 1
          fi

          # Counter restarts at 1 for each new upstream base version.
          COUNTER=$(git tag --list "v${BASE_VERSION}+atmp*" \
                      | sed -E 's/^v.+\+atmp([0-9]+)$/\1/' | sort -n | tail -1)
          NEXT_COUNTER=$(( ${COUNTER:-0} + 1 ))
          NEW_VERSION="${BASE_VERSION}+atmp${NEXT_COUNTER}"
          NEW_TAG="v${NEW_VERSION}"

          echo "Upstream base: v$BASE_VERSION, last counter: ${COUNTER:-none} -> next: $NEW_TAG"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Stamp version (not committed - build-only)
        run: npm pkg set version=${{ steps.version.outputs.new_version }}

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:nocoverage

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npx vsce package --no-dependencies --baseContentUrl https://raw.githubusercontent.com/atlassian/atlascode/main/

      - name: Tag release commit
        run: |
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          files: atlascode-*.vsix
